[package]
name = "ox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
chrono.workspace = true
log.workspace = true
ignore = "0.4"
trash = "5"
sysinfo = "0.39"
notify = "8"
open = "5"
regex = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "chrono"] }
tar = "0.4"
flate2 = "1"
sys-locale = "0.3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate"] }
sha2 = "0.10"
md-5 = "0.10"
kamadak-exif = "0.6"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Graphics_DirectX_Direct3D11",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
sha2 = "0.10"
md-5 = "0.10"

# Copy benchmark (see README, "Copy benchmark"). `test = true` runs its unit
# tests with `cargo test`; the benchmark itself only runs with `cargo run --example`.
[[example]]
name = "copy_bench"
test = true
