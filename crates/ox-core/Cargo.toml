[package]
name = "ox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
toml.workspace = true
dirs.workspace = true
chrono.workspace = true
log.workspace = true
ignore = "0.4"
trash = "5"
sysinfo = "0.39"
notify = "8"
open = "5"
regex = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64", "chrono"] }
tar = "0.4"
flate2 = "1"
sys-locale = "0.3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "deflate"] }
sha2 = "0.10"
md-5 = "0.10"
kamadak-exif = "0.6"
# Picture tools (rotate, convert, resize).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
# SVG drawings (texts in the system's fonts; no embedded JPEG/GIF/WebP).
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# Data files in the preview: JSON, XML, YAML trees and SQLite tables.
serde_json = "1"
quick-xml = "0.42"
yaml-rust2 = { version = "0.13", default-features = false }
# Bundled: SQLite is compiled in (opened read-only, never written).
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks"] }
# Remote locations (SFTP, FTP/FTPS, WebDAV). All pure Rust; TLS is rustls
# with the ring provider (no OpenSSL, no aws-lc), certificates checked
# against the Windows certificate store.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
suppaftp = { version = "12", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
# Text of PDF files for the text index (pure Rust, on lopdf).
pdf-extract = "0.12"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_Services", "Win32_System_Threading"] }
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Data_Xml_Dom",
    "Foundation",
    "Graphics_DirectX_Direct3D11",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinHttp",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["compress"] }
sha2 = "0.10"
md-5 = "0.10"

# Copy benchmark (see README, "Copy benchmark"). `test = true` runs its unit
# tests with `cargo test`; the benchmark itself only runs with `cargo run --example`.
[[example]]
name = "copy_bench"
test = true
