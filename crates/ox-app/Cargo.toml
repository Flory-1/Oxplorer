[package]
name = "ox-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oxplorer"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
ox-core.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
serde.workspace = true
toml.workspace = true
eframe = "0.37"
egui = "0.37"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
egui_extras = { version = "0.37", default-features = false, features = ["syntect"] }
lofty = "0.25"
ttf-parser = "0.25"
alacritty_terminal = { version = "0.26", default-features = false }

[dev-dependencies]
tempfile = "3"
