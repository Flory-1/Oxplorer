[package]
name = "ox-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oxplorer"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
ox-core.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
serde.workspace = true
toml.workspace = true
# persistence: remembers the window's position, size and maximized state.
eframe = { version = "0.37", features = ["persistence"] }
# Black-and-white emoji fonts for the icons in menus and buttons. Without
# them, egui takes them from the system: Windows' colour emoji font.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
egui_extras = { version = "0.37", default-features = false, features = ["syntect", "image", "file"] }
# Markdown preview (with local images and highlighted code blocks).
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "load-images", "better_syntax_highlighting"] }
lofty = "0.25"
ttf-parser = "0.25"
raw-window-handle = "0.6"
alacritty_terminal = { version = "0.26", default-features = false }

# Glow can draw see-through windows on Windows (for Mica/Acrylic); wgpu can't reliably.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", features = ["glow"] }

[dev-dependencies]
tempfile = "3"
