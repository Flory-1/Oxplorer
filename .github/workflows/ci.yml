name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee test-output.txt; then
            # Publish failing tests as an annotation (readable without the raw log).
            details=$(grep -E "^(test .* FAILED|thread '.*' .*panicked|---- )" -A4 test-output.txt | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Failing tests on ${{ matrix.os }}::${details}"
            exit 1
          fi

  build-windows:
    name: Windows release build
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p ox-app
      - name: Build installer
        shell: pwsh
        run: installer/build.ps1 -Tag "v0.0.0-ci" -Repository "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: oxplorer-windows-x64
          path: |
            target/release/oxplorer.exe
            dist/oxplorer-*-setup-x64.exe
